
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Drum Kit</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <main class="container">
        <header>
            <p class="tag">MUSIC STUDIO / 001</p>
            <h1>DRUM <span>KIT.</span></h1>
            <p class="subtitle">Feel the rhythm. Play your beat.</p>
        </header>

        <section class="drum-kit">
            <button class="drum crash" data-key="w">
                <span class="key">W</span>
                <span class="emoji">💥</span>
                <span class="name">CRASH</span>
            </button>

            <button class="drum kick" data-key="a">
                <span class="key">A</span>
                <span class="emoji">🥁</span>
                <span class="name">KICK</span>
            </button>

            <button class="drum snare" data-key="s">
                <span class="key">S</span>
                <span class="emoji">🔊</span>
                <span class="name">SNARE</span>
            </button>

            <button class="drum tom" data-key="d">
                <span class="key">D</span>
                <span class="emoji">🪘</span>
                <span class="name">TOM</span>
            </button>

            <button class="drum hihat" data-key="j">
                <span class="key">J</span>
                <span class="emoji">🎵</span>
                <span class="name">HI-HAT</span>
            </button>

            <button class="drum ride" data-key="k">
                <span class="key">K</span>
                <span class="emoji">🔔</span>
                <span class="name">RIDE</span>
            </button>

            <button class="drum clap" data-key="l">
                <span class="key">L</span>
                <span class="emoji">👏</span>
                <span class="name">CLAP</span>
            </button>
        </section>

        <section class="info">
            <div class="status">
                <span class="dot"></span>
                <span id="message">READY TO PLAY</span>
            </div>
            <p>USE YOUR KEYBOARD OR CLICK THE PADS</p>
        </section>

        <footer>MADE FOR THE LOVE OF MUSIC ♫</footer>
    </main>

    <script src="script.js"></script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Instagram</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css">
</head>

<body>

    <div class="mobile">

        <!-- Instagram Logo -->
        <div class="logo">
            Instagram
        </div>


        <!-- Login Form -->
        <form>

            <input
                type="text"
                placeholder="Phone number, username, or email"
            >

            <input
                type="password"
                placeholder="Password"
            >

            <button type="submit">
                Log in
            </button>

        </form>


        <!-- Forgot Password -->
        <a href="#" class="forgot">
            Forgot password?
        </a>


        <!-- OR -->
        <div class="or">
            <span></span>
            <p>OR</p>
            <span></span>
        </div>


        <!-- Facebook Login -->
        <a href="#" class="facebook">
            <i class="ri-facebook-circle-fill"></i>
            Log in with Facebook
        </a>


        <!-- Create Account -->
        <div class="create">
            <p>Don't have an account?</p>

            <a href="#">
                Sign up
            </a>
        </div>


        <!-- Meta -->
        <div class="meta">
            <i class="ri-meta-fill"></i>
            Meta
        </div>

    </div>

</body>

</html>

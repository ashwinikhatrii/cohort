<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calendar</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="calendar">

        <!-- Calendar Header -->
        <div class="calendar-header">
            <button>&lt;</button>

            <h2>October 2026</h2>

            <button>&gt;</button>
        </div>

        <!-- Days Name -->
        <div class="weekdays">
            <div>Sun</div>
            <div>Mon</div>
            <div>Tue</div>
            <div>Wed</div>
            <div>Thu</div>
            <div>Fri</div>
            <div>Sat</div>
        </div>

        <!-- Dates -->
        <div class="days">

            <!-- Previous month -->
            <div class="other-month">27</div>
            <div class="other-month">28</div>
            <div class="other-month">29</div>
            <div class="other-month">30</div>

            <!-- October -->
            <div>1</div>
            <div>2</div>
            <div>3</div>

            <div>4</div>
            <div>5</div>
            <div>6</div>
            <div>7</div>
            <div>8</div>
            <div>9</div>
            <div>10</div>

            <div>11</div>
            <div>12</div>
            <div>13</div>
            <div>14</div>
            <div>15</div>
            <div>16</div>
            <div>17</div>

            <div>18</div>
            <div>19</div>
            <div>20</div>
            <div>21</div>
            <div>22</div>
            <div>23</div>
            <div>24</div>

            <div>25</div>
            <div>26</div>
            <div>27</div>
            <div>28</div>
            <div>29</div>
            <div>30</div>
            <div>31</div>

        </div>

    </div>

</body>
</html>

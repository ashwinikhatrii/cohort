<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Product Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="product-card">

        <div class="product-image">
            <img src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=600" 
                 alt="Red Shoe">
        </div>

        <div class="product-info">
            <p class="category">Running Shoes</p>

            <h2>Sport Running Shoes</h2>

            <p class="description">
                Comfortable and lightweight shoes designed for everyday running.
            </p>

            <div class="rating">
                ★★★★☆ <span>(120 reviews)</span>
            </div>

            <div class="price">
                <span class="current-price">₹1,999</span>
                <span class="old-price">₹2,999</span>
            </div>

            <button class="cart-btn">Add to Cart</button>
        </div>

    </div>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Music Player</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="player">

        <div class="cover">
            <img src="https://images.unsplash.com/photo-1516280440614-37939bbacd81?auto=format&fit=crop&w=500&q=80"
                 alt="Album Cover">
        </div>

        <div class="song-info">
            <h2>Midnight Dreams</h2>
            <p>Unknown Artist</p>
        </div>

        <div class="progress-area">
            <div class="progress"></div>
        </div>

        <div class="time">
            <span>1:24</span>
            <span>3:45</span>
        </div>

        <div class="controls">
            <button>↶</button>
            <button class="play">▶</button>
            <button>↷</button>
        </div>

        <div class="volume">
            <span>🔊</span>
            <div class="volume-bar">
                <div></div>
            </div>
        </div>

    </div>

</body>
</html>

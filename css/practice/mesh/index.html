<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Mess Food Tracker</title>

    <link
        rel="stylesheet"
        href="style.css"
    >

    <!-- jsPDF -->
    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js">
    </script>

    <!-- jsPDF AutoTable -->
    <script
        src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js">
    </script>

</head>


<body>

<div class="container">


    <!-- =================================
         HEADER
    ================================== -->

    <header class="header">

        <h1>
            🍽️ Mess Food Tracker
        </h1>

        <p>
            Track your mess food and payment cycles
        </p>

        <div
            id="connectionStatus"
            class="connection-status"
        >
            Connecting to Google Sheets...
        </div>

    </header>



    <!-- =================================
         PERSON SELECTION
    ================================== -->

    <section class="section">

        <h2>
            Who are you adding data for?
        </h2>


        <div class="people-grid">


            <!-- ASHWINI -->

            <button
                class="person-card"
                data-person="Ashwini"
                type="button"
            >

                <div class="person-icon">
                    A
                </div>

                <h3>
                    Ashwini
                </h3>

                <span>
                    Add / View Record
                </span>

            </button>



            <!-- RAJ -->

            <button
                class="person-card"
                data-person="Raj"
                type="button"
            >

                <div class="person-icon">
                    R
                </div>

                <h3>
                    Raj
                </h3>

                <span>
                    Add / View Record
                </span>

            </button>



            <!-- RAHUL -->

            <button
                class="person-card"
                data-person="Rahul"
                type="button"
            >

                <div class="person-icon">
                    R
                </div>

                <h3>
                    Rahul
                </h3>

                <span>
                    Add / View Record
                </span>

            </button>


        </div>

    </section>



    <!-- =================================
         ADD RECORD SECTION
    ================================== -->

    <section
        id="recordSection"
        class="section hidden"
    >


        <div class="section-header">


            <div>

                <p class="small-label">
                    Adding record for
                </p>

                <h2 id="selectedPerson">
                    Ashwini
                </h2>

            </div>


            <button
                id="changePersonBtn"
                class="secondary-btn"
                type="button"
            >
                Change Person
            </button>


        </div>



        <!-- DATE -->

        <div class="form-group">

            <label for="recordDate">
                Select Date
            </label>

            <input
                type="date"
                id="recordDate"
            >

        </div>



        <!-- FOOD STATUS -->

        <div class="form-group">

            <label>
                Select Food Status
            </label>


            <div class="status-grid">


                <!-- FULL DAY -->

                <button
                    class="status-btn"
                    data-value="1"
                    type="button"
                >

                    <strong>
                        ✓✓
                    </strong>

                    <span>
                        Full Day
                    </span>

                    <small>
                        1 Day
                    </small>

                </button>



                <!-- HALF DAY -->

                <button
                    class="status-btn"
                    data-value="0.5"
                    type="button"
                >

                    <strong>
                        ✓X
                    </strong>

                    <span>
                        Half Day
                    </span>

                    <small>
                        0.5 Day
                    </small>

                </button>



                <!-- NO FOOD -->

                <button
                    class="status-btn"
                    data-value="0"
                    type="button"
                >

                    <strong>
                        XX
                    </strong>

                    <span>
                        No Food
                    </span>

                    <small>
                        0 Day
                    </small>

                </button>


            </div>

        </div>



        <!-- SAVE BUTTON -->

        <button
            id="saveBtn"
            class="save-btn"
            type="button"
        >
            Save Record
        </button>


        <div
            id="saveMessage"
            class="message"
        ></div>


    </section>



    <!-- =================================
         HISTORY SECTION
    ================================== -->

    <section
        id="historySection"
        class="section hidden"
    >


        <div class="section-header">


            <div>

                <p class="small-label">
                    Payment Records
                </p>

                <h2 id="historyPerson">
                    Ashwini
                </h2>

            </div>


            <button
                id="downloadBtn"
                class="download-btn"
                type="button"
            >
                📄 Download Record
            </button>


        </div>



        <!-- PAYMENT CYCLE FILTER -->

        <div class="cycle-filter">

            <label for="cycleFilter">
                Payment Cycle
            </label>

            <select
                id="cycleFilter"
            >

                <option value="all">
                    All Records
                </option>

            </select>

        </div>



        <!-- CYCLE INFORMATION -->

        <div
            id="cycleInfo"
            class="cycle-info"
        ></div>



        <!-- HISTORY -->

        <div id="historyContainer">

            <div class="loading">
                Select a person to see records.
            </div>

        </div>



        <!-- TOTAL FOOD DAYS -->

        <div class="total-box">

            <span>
                Food Days
            </span>

            <strong id="totalDays">
                0
            </strong>

        </div>


    </section>


</div>



<!-- =================================
     DOWNLOAD MODAL
================================== -->

<div
    id="cycleModal"
    class="modal hidden"
>


    <div class="modal-box">


        <button
            id="closeModal"
            class="close-btn"
            type="button"
        >
            ×
        </button>


        <h2>
            Download Record
        </h2>


        <p id="downloadPersonText">
            Select a payment cycle.
        </p>



        <div class="form-group">

            <label for="downloadCycle">
                Select Payment Cycle
            </label>


            <select
                id="downloadCycle"
            >

                <option value="">
                    Select Cycle
                </option>

            </select>

        </div>



        <button
            id="confirmDownload"
            class="save-btn"
            type="button"
        >
            📥 Download PDF
        </button>


    </div>

</div>



<!-- JAVASCRIPT -->

<script src="script.js"></script>


</body>

</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Weather App</title>

    <link rel="stylesheet" href="styles.css">
</head>
<body>

    <div class="weather-app">

        <!-- Header -->
        <h1>Weather App</h1>
        <p class="subtitle">Check your city's weather</p>

        <!-- Search Bar -->
        <div class="search-box">
            <input type="text" placeholder="Enter city name">
            <button>Search</button>
        </div>

        <!-- Weather Card -->
        <div class="weather-card">

            <h2>Ranchi, India</h2>
            <p class="date">Tuesday, September 22</p>

            <!-- Weather Icon -->
            <div class="weather-icon">🌤️</div>

            <!-- Temperature -->
            <h3>28°C</h3>
            <p class="condition">Partly Cloudy</p>

            <!-- Weather Details -->
            <div class="weather-details">

                <div class="detail-box">
                    <span>💧</span>
                    <p>Humidity</p>
                    <h4>65%</h4>
                </div>

                <div class="detail-box">
                    <span>💨</span>
                    <p>Wind Speed</p>
                    <h4>12 km/h</h4>
                </div>

            </div>

        </div>

        <!-- Footer -->
        <footer>
            Made with ❤️ using HTML & CSS
        </footer>

    </div>

</body>
</html>

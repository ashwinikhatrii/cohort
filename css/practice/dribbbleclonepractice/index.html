<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dribbble</title>
    <link rel="stylesheet" href="styles.css" />
    <link
      href="https://cdn.jsdelivr.net/npm/remixicon@4.9.0/fonts/remixicon.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <header class="navbar">
      <!-- navbar -->

      <div class="logo">Dribble</div>

      <nav class="nav-links">
        <a href="#">Explore</a>
        <a href="#">Hire Talent</a>
        <a href="#">Get Hired</a>
        <a href="#">Community</a>
      </nav>
      <div class="nav-actions">
        <button>Start Project Brief</button>
        <span><i class="ri-message-fill"></i></span>
        <span><i class="ri-notification-3-line"></i></span>
        <img src="./source/profile.jpeg" alt="" />
      </div>
    </header>

    <main>
      <section class="hero">
        <div class="hero-content">
            <div class="hero-tabs">
                <button>HIRE TALENT</button>
                <button>GET HIRED</button>
            </div>

            <h1>
                Work with the world’s
                <br> best in <span>Motion design</span>
            </h1>

            <div class="features">
                <p>
                    <span><i class="ri-check-fill"></i></span>
                    Generate your brief and receive proposals-for free
                </p>

                <p>
                    <span><i class="ri-check-fill"></i></span>
                    Browse real design and development work
                </p>

                <p>
                    <span><i class="ri-check-fill"></i></span>
                    Hire top-rated freelancers and agencies
                </p>
            </div>

            <button class="hero-button">
                <i class="ri-sparkling-line"></i> Start Your Project Brief
            </button>

          <!-- heading,features , button  -->
        </div>
        <div class="hero-image">
            <!-- image -->
             <img src="https://c.ndtvimg.com/2021-12/mmk6notg_bike_625x300_23_December_21.jpg" alt="">
        </div>
      </section>
    </main>
    <footer class="bottom-nav">
      <!-- bottom navigation -->
       <div class="bottom-item">
            <i class="ri-image-2-line"></i>
            <span>Shots</span>
       </div>
       
       <div class="bottom-item">
            <i class="ri-group-line"></i>
            <span>Designers</span>
       </div>


       <div class="bottom-item">
            <i class="ri-service-line"></i>
            <span>Services</span>
       </div>

    </footer>
  </body>
</html>

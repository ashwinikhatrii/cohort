<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Profile Card</title>

    <!-- Linking CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="profile-card">

        <!-- Profile Header -->
        <div class="profile-header">

            <img
                src="https://i.pravatar.cc/150?img=12"
                alt="Profile Picture"
                class="profile-pic"
            >

            <div class="user-info">
                <h2>ashwinikhatrii</h2>
                <p class="fullname">Ashwini Khatri</p>
            </div>

        </div>

        <!-- Bio Section -->
        <div class="bio">
            <p>💻 Computer Application Student</p>
            <p>🚀 Learning Web Development</p>
            <p>✨ Building my future, one line at a time.</p>
        </div>

        <!-- Statistics -->
        <div class="stats">

            <div class="stat">
                <span class="number">128</span>
                <span class="label">Posts</span>
            </div>

            <div class="stat">
                <span class="number">1.4K</span>
                <span class="label">Followers</span>
            </div>

            <div class="stat">
                <span class="number">312</span>
                <span class="label">Following</span>
            </div>

        </div>

        <!-- Buttons -->
        <div class="buttons">
            <button class="follow-btn">Follow</button>
            <button class="message-btn">Message</button>
        </div>

    </div>

</body>
</html>

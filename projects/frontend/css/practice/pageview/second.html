<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Instagram Home</title>

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/remixicon@4.6.0/fonts/remixicon.css">

    <link rel="stylesheet" href="second.css">
</head>

<body>

    <div class="app">

        <!-- TOP NAVBAR -->

        <header class="top-bar">

            <h1>Instagram</h1>

            <div class="top-icons">
                <i class="ri-heart-line"></i>
                <i class="ri-messenger-line"></i>
            </div>

        </header>


        <!-- STORIES -->

        <div class="stories">

            <div class="story">
                <div class="story-img add">
                    <i class="ri-add-line"></i>
                </div>
                <p>Your story</p>
            </div>

            <div class="story">
                <div class="story-img">
                    <img src="https://i.pravatar.cc/100?img=12">
                </div>
                <p>rahul</p>
            </div>

            <div class="story">
                <div class="story-img">
                    <img src="https://i.pravatar.cc/100?img=32">
                </div>
                <p>ashwini</p>
            </div>

            <div class="story">
                <div class="story-img">
                    <img src="https://i.pravatar.cc/100?img=47">
                </div>
                <p>rohan</p>
            </div>

            <div class="story">
                <div class="story-img">
                    <img src="https://i.pravatar.cc/100?img=5">
                </div>
                <p>riya</p>
            </div>

        </div>


        <!-- POST -->

        <article class="post">

            <!-- Post Header -->

            <div class="post-header">

                <div class="user">

                    <img src="https://i.pravatar.cc/100?img=12">

                    <div>
                        <h3>rahul_dev</h3>
                        <p>Ranchi, India</p>
                    </div>

                </div>

                <i class="ri-more-2-fill"></i>

            </div>


            <!-- Post Image -->

            <div class="post-image">

                <img
                    src="https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?auto=format&fit=crop&w=700&q=80"
                    alt="Post">

            </div>


            <!-- Post Actions -->

            <div class="post-actions">

                <div>
                    <i class="ri-heart-line"></i>
                    <i class="ri-chat-3-line"></i>
                    <i class="ri-send-plane-line"></i>
                </div>

                <i class="ri-bookmark-line"></i>

            </div>


            <!-- Likes -->

            <div class="post-content">

                <strong>1,248 likes</strong>

                <p>
                    <b>rahul_dev</b>
                    Beautiful evening ✨
                    <span>#photography #life</span>
                </p>

                <small>View all 42 comments</small>

                <p class="time">2 HOURS AGO</p>

            </div>

        </article>


        <!-- SECOND POST -->

        <article class="post">

            <div class="post-header">

                <div class="user">

                    <img src="https://i.pravatar.cc/100?img=32">

                    <div>
                        <h3>ashwini</h3>
                        <p>Delhi, India</p>
                    </div>

                </div>

                <i class="ri-more-2-fill"></i>

            </div>


            <div class="post-image second">

                <img
                    src="https://images.unsplash.com/photo-1500534623283-312aade485b7?auto=format&fit=crop&w=700&q=80"
                    alt="Nature">

            </div>


            <div class="post-actions">

                <div>
                    <i class="ri-heart-line"></i>
                    <i class="ri-chat-3-line"></i>
                    <i class="ri-send-plane-line"></i>
                </div>

                <i class="ri-bookmark-line"></i>

            </div>


            <div class="post-content">

                <strong>856 likes</strong>

                <p>
                    <b>ashwini</b>
                    Weekend vibes 🌿
                </p>

                <small>View all 18 comments</small>

                <p class="time">5 HOURS AGO</p>

            </div>

        </article>


        <!-- BOTTOM NAVIGATION -->

        <nav class="bottom-nav">

            <i class="ri-home-5-fill"></i>

            <i class="ri-search-line"></i>

            <i class="ri-add-box-line"></i>

            <i class="ri-movie-line"></i>

            <img src="https://i.pravatar.cc/100?img=12">

        </nav>

    </div>

</body>

</html>


<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chips Packet Design</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="packet">
        <div class="shine"></div>

        <div class="top-fold"></div>

        <div class="brand">
            <span class="brand-name">CRUNCHO</span>
            <span class="brand-tag">THE TASTE OF FUN!</span>
        </div>

        <div class="flavor">
            <span>MASALA</span>
            <h1>MASTI</h1>
        </div>

        <div class="chips">
            <div class="chip chip1"></div>
            <div class="chip chip2"></div>
            <div class="chip chip3"></div>
            <div class="chip chip4"></div>
            <div class="chip chip5"></div>
        </div>

        <div class="burst">100%<br>CRUNCH</div>

        <div class="bottom-text">
            <span>EXTRA TASTY • EXTRA CRUNCHY</span>
            <strong>NET WT. 52 g</strong>
        </div>

        <div class="bottom-fold"></div>
    </div>

</body>
</html>

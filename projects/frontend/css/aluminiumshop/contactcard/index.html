
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harsh Raj Aluminium Visiting Card</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="visiting-card">

        <div class="top">

                <p>Aluminium Works & Solutions</p>

                <strong>+91 87099 37753</strong>

            <div class="buttons">

                <a href="https://wa.me/918709937753"

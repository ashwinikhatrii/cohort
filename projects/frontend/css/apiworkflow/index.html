<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>API Workflow</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="card">

    <div class="card-top">
      <div class="icon">⚡</div>

      <div>
        <h3>API Workflow</h3>
        <p>Automate your workflow</p>
      </div>
    </div>

    <div class="steps">

      <div class="step">
        <span>01</span>
        <div>
          <b>Request</b>
          <small>Send API request</small>
        </div>
      </div>

      <div class="line"></div>

      <div class="step">
        <span>02</span>
        <div>
          <b>Process</b>
          <small>Process the data</small>
        </div>
      </div>

      <div class="line"></div>

      <div class="step">
        <span>03</span>
        <div>
          <b>Response</b>
          <small>Receive JSON data</small>
        </div>
      </div>

    </div>

    <button>View Workflow →</button>

  </div>

</body>
</html>

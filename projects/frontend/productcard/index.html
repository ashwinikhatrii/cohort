<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Product Mini Card</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="product-card">
      <span class="discount">-25%</span>

      <div class="product-image">
        <img
          src="https://images.unsplash.com/photo-1542291026-7eec264c27ff?w=600"
          alt="Red sneaker"
        />
      </div>

      <div class="product-info">
        <p class="category">SPORTS SHOES</p>
        <h2>Air Runner</h2>
        <p class="description">Lightweight shoes for everyday comfort.</p>

        <div class="price">
          <span class="current-price">₹2,999</span>
          <span class="old-price">₹3,999</span>
        </div>

        <button class="cart-btn">Add to Cart ↗</button>
      </div>
    </div>
  </body>
</html>


<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Daily Task Card</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="task-card">

    <div class="card-header">
      <div>
        <p class="subtitle">YOUR WORKSPACE</p>
        <h2>Daily Tasks<span>.</span></h2>
      </div>

      <div class="date">14 OCT</div>
    </div>

    <div class="progress-section">
      <div class="progress-info">
        <span>Today's progress</span>
        <strong>2 of 4 completed</strong>
      </div>

      <div class="progress-bar">
        <div class="progress-fill"></div>
      </div>
    </div>

    <div class="task-list">

      <label class="task completed">
        <input type="checkbox" checked>
        <span class="custom-check"></span>
        <span class="task-text">
          <strong>Morning workout</strong>
          <small>07:00 AM · Health</small>
        </span>
        <span class="task-tag">DONE</span>
      </label>

      <label class="task completed">
        <input type="checkbox" checked>
        <span class="custom-check"></span>
        <span class="task-text">
          <strong>Study HTML & SCSS</strong>
          <small>10:00 AM · Learning</small>
        </span>
        <span class="task-tag">DONE</span>
      </label>

      <label class="task">
        <input type="checkbox">
        <span class="custom-check"></span>
        <span class="task-text">
          <strong>Complete mini project</strong>
          <small>02:00 PM · Coding</small>
        </span>
        <span class="task-tag pending">NEXT</span>
      </label>

      <label class="task">
        <input type="checkbox">
        <span class="custom-check"></span>
        <span class="task-text">
          <strong>Read for 20 minutes</strong>
          <small>08:00 PM · Personal</small>
        </span>
        <span class="task-tag pending">NEXT</span>
      </label>

    </div>

    <div class="card-footer">
      <span>✦ Keep showing up.</span>
      <span>STRIDE / PRODUCTIVITY</span>
    </div>

  </div>

</body>
</html>

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Swipe Profile Cards</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <h1>Find Your Match ❤️</h1>
      <p class="subtitle">Swipe right if you like someone!</p>

      <div class="card-container" id="cardContainer"></div>

      <div class="buttons" id="actionButtons">
        <button class="action pass" id="passBtn" aria-label="Pass">✕</button>
        <button class="action like" id="likeBtn" aria-label="Like">♥</button>
      </div>

      <p class="message" id="message">Discover someone new ✨</p>
      <button class="restart" id="restartBtn" hidden>↻ Start Again</button>
    </main>

    <script src="script.js"></script>
  </body>
</html>
